name: Build and deploy chrome extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  build:
    name: Build chrome extension
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      issues: write
      statuses: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install NPM packages
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Build project
        run: npm run build:prod

      - name: Run tests and produce reports
        run: npm run test:ci

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6.6.1
        if: always()
        with:
          report_paths: junit.xml
          check_name: Jest Test Report
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Publish code coverage results
        uses: romeovs/lcov-reporter-action@v0.4.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy chrome extension
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Zip contents
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r extension.zip dist

      - name: Publish to Chrome store
        uses: Klemensas/chrome-extension-upload-action@v1.3
        with:
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          app-id: ${{ secrets.CHROME_APP_ID }}
          file-name: "./extension.zip"
